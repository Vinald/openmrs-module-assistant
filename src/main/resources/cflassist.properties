# Default cfl-assist widget base URL, used when the CFLASSIST_WIDGET_URL environment
# variable is not set in the container.
widget.url.default=http://localhost:4000

# data-* attribute name written on the injected <script> tag; used to detect whether the
# widget has already been injected into a response.
widget.marker=cflassist-widget

# Comma-separated file extensions that are never HTML documents. Requests for them skip
# response buffering entirely.
static.asset.suffixes=.js,.css,.map,.json,.ico,.png,.jpg,.jpeg,.gif,.svg,.webp,.woff,.woff2,.ttf,.eot,.otf,.pdf,.zip,.txt
